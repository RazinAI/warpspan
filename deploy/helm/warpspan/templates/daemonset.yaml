apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "warpspan.fullname" . }}
  labels:
    {{- include "warpspan.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "warpspan.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "warpspan.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # The agent doesn't talk to the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --socket={{ .Values.socketDir }}/warpspan.sock
            - --otlp-endpoint={{ .Values.otlp.endpoint }}
            - --interval={{ .Values.interval }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.otlp.headersFromSecret.name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otlp.headersFromSecret.name }}
                  key: {{ .Values.otlp.headersFromSecret.key }}
            {{- else if .Values.otlp.headers }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ include "warpspan.headers" . | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: run
              mountPath: {{ .Values.socketDir }}
      volumes:
        - name: run
          hostPath:
            path: {{ .Values.socketDir }}
            type: DirectoryOrCreate
