# Local backend for warpspan: Collector -> Pyroscope (profiles) + Tempo (traces) -> Grafana.
# Ports are bound to 127.0.0.1 only: Grafana runs with anonymous admin access.
#
#   docker compose -f deploy/docker-compose.yaml up -d
#   Grafana:   http://localhost:3000  (anonymous admin; GRAFANA_PORT=3001 to use another port)
#   OTLP gRPC: localhost:4317  (point the agent and your app's traces here)
#
# The agent is optional here (profile "agent"); running the binary on the host
# is usually simpler: ./bin/warpspan --socket /tmp/warpspan/warpspan.sock
#   docker compose -f deploy/docker-compose.yaml --profile agent up -d --build
# creates the socket in deploy/run/warpspan.sock.

services:
  otel-collector:
    image: otel/opentelemetry-collector:0.165.0
    command: ["--config=/etc/otelcol/config.yaml", "--feature-gates=service.profilesSupport"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on: [pyroscope, tempo]

  pyroscope:
    image: grafana/pyroscope:2.4.4
    # The default ingestion limit (4 MiB/s, 2 MiB burst) rejects whole pushes
    # from GPU-heavy apps with spans and NVTX labels (one sample per kernel x
    # span x label path).
    command: ["-distributor.ingestion-rate-limit-mb=64", "-distributor.ingestion-burst-size-mb=64"]
    ports:
      - "127.0.0.1:4040:4040" # Pyroscope UI/API

  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [pyroscope, tempo]

  agent:
    profiles: [agent]
    build:
      context: ..
      dockerfile: agent/Dockerfile
    command: ["--socket=/var/run/warpspan/warpspan.sock", "--otlp-endpoint=http://otel-collector:4317"]
    volumes:
      - ./run:/var/run/warpspan
    depends_on: [otel-collector]
