# Warpspan agent: one pod per GPU node. Capture libraries in app pods on the
# same node connect to /var/run/warpspan/warpspan.sock (shared via hostPath).
#
# Build and push the image first:
#   docker build -f agent/Dockerfile -t <registry>/warpspan-agent:0.1.0 . && docker push ...
# and set --otlp-endpoint to your Collector (or Pyroscope's :4040 directly).
apiVersion: v1
kind: Namespace
metadata:
  name: warpspan
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: warpspan-agent
  namespace: warpspan
spec:
  selector:
    matchLabels:
      app: warpspan-agent
  template:
    metadata:
      labels:
        app: warpspan-agent
    spec:
      # Only GPU nodes (label set by the NVIDIA GPU operator / device plugin; adjust to your cluster).
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: ghcr.io/zraisan/warpspan-agent:0.1.0
          args:
            - --socket=/var/run/warpspan/warpspan.sock
            - --otlp-endpoint=otel-collector.observability.svc:4317
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: run
              mountPath: /var/run/warpspan
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: run
          hostPath:
            path: /var/run/warpspan
            type: DirectoryOrCreate
