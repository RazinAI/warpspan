[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warpspan"
license = { text = "PolyForm-Strict-1.0.0" }
version = "0.1.0"
description = "Span bridge linking OpenTelemetry spans to GPU kernels captured by libwarpspan.so"
requires-python = ">=3.9"
dependencies = ["opentelemetry-api>=1.20"]

# opentelemetry-instrument calls these before instrumenting the app.
[project.entry-points.opentelemetry_pre_instrument]
warpspan = "warpspan:install"

[project.optional-dependencies]
test = ["pytest", "opentelemetry-sdk>=1.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
