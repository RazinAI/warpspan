# Builds the agent image and the inject image (one per CUDA version) and pushes
# them to GHCR:
#   ghcr.io/razinai/warpspan-agent:<version>, :sha-<commit>, :edge
#   ghcr.io/razinai/warpspan-inject:<version>-cuda<X.Y>, :sha-<commit>-cuda<X.Y>, :edge-cuda<X.Y>
#   (the default CUDA build also gets :<version> and :edge)
# <version> is the chart's appVersion; the agent and the Python package must
# match it. A version tag that already exists is never overwritten: bump the
# version to release. Pull requests only build.
#
# When the version is new (no tag v<version> yet), the release job also creates
# the GitHub release v<version>: the library per CUDA version (with libcupti and
# the Python bridge), the agent binary, the Python wheel and SHA256SUMS. Its notes
# are .github/release-notes.md followed by the commits since the last release. It
# also tags bridge/go/v<version> so the Go bridge can be fetched at that version.
name: images

on:
  push:
    branches: [master]
    paths:
      - "agent/**"
      - "cmd/warpspan/**"
      - "go.mod"
      - "go.sum"
      - "capture/**"
      - "bridge/python/src/**"
      - "bridge/python/autoload/**"
      - "deploy/helm/warpspan/Chart.yaml"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "agent/**"
      - "cmd/warpspan/**"
      - "go.mod"
      - "go.sum"
      - "capture/**"
      - "bridge/python/src/**"
      - "bridge/python/autoload/**"
      - "deploy/helm/warpspan/Chart.yaml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Runs on master queue up rather than cancel each other, so a release is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/razinai
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      chart_version: ${{ steps.v.outputs.chart_version }}
      sha: ${{ steps.v.outputs.sha }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Check that every version matches the chart's appVersion
        run: |
          chart=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' deploy/helm/warpspan/Chart.yaml)
          agent=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/warpspan/main.go)
          py=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' bridge/python/src/warpspan/__init__.py)
          pyproject=$(sed -n 's/^version = "\(.*\)"$/\1/p' bridge/python/pyproject.toml)
          echo "chart=$chart agent=$agent python=$py pyproject=$pyproject"
          for v in "$agent" "$py" "$pyproject"; do
            [ "$v" = "$chart" ] || { echo "::error::versions differ; set them all to the chart's appVersion ($chart)"; exit 1; }
          done
          echo "version=$chart" >> "$GITHUB_OUTPUT"
          echo "chart_version=$(awk '/^version:/ {print $2}' deploy/helm/warpspan/Chart.yaml)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$PUSH" = true ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$chart" > /dev/null; then
            release=true
            echo "::notice::v$chart is not released yet; this run releases it."
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  agent:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Tags
        env:
          IMAGE: ${{ env.REGISTRY }}/warpspan-agent
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          tags="$IMAGE:sha-$SHA,$IMAGE:edge"
          if [ "$PUSH" = true ] && docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$VERSION already exists; bump the version to release a new one."
          else
            tags="$tags,$IMAGE:$VERSION"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      # The release binary is taken out of the same build, from the cache.
      - name: Export the agent binary for the release
        if: needs.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          outputs: type=local,dest=out
          cache-from: type=gha,scope=agent
      - if: needs.version.outputs.release == 'true'
        run: cp out/warpspan "warpspan-agent-${{ needs.version.outputs.version }}-linux-amd64"
      - if: needs.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-agent
          path: warpspan-agent-*
          if-no-files-found: error

  inject:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The library has to be built against a CUDA no newer than the node's
          # driver supports. Ubuntu 20.04 bases keep the glibc requirement at
          # 2.31; CUDA 13 has no 20.04 image, so its build needs glibc 2.35.
          - { cuda: "11.8", image: "nvidia/cuda:11.8.0-devel-ubuntu20.04" }
          - { cuda: "12.4", image: "nvidia/cuda:12.4.1-devel-ubuntu20.04" }
          - { cuda: "12.6", image: "nvidia/cuda:12.6.3-devel-ubuntu20.04", default: true }
          - { cuda: "12.8", image: "nvidia/cuda:12.8.1-devel-ubuntu20.04" }
          - { cuda: "13.0", image: "nvidia/cuda:13.0.1-devel-ubuntu22.04" }
    steps:
      - name: Free disk space for the CUDA image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Tags
        env:
          IMAGE: ${{ env.REGISTRY }}/warpspan-inject
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          CUDA: ${{ matrix.cuda }}
          DEFAULT: ${{ matrix.default || false }}
        run: |
          tags="$IMAGE:sha-$SHA-cuda$CUDA,$IMAGE:edge-cuda$CUDA"
          [ "$DEFAULT" = true ] && tags="$tags,$IMAGE:edge"
          if [ "$PUSH" = true ] && docker buildx imagetools inspect "$IMAGE:$VERSION-cuda$CUDA" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$VERSION-cuda$CUDA already exists; bump the version to release a new one."
          else
            tags="$tags,$IMAGE:$VERSION-cuda$CUDA"
            [ "$DEFAULT" = true ] && tags="$tags,$IMAGE:$VERSION"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: capture/Dockerfile
          platforms: linux/amd64
          build-args: CUDA_IMAGE=${{ matrix.image }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=inject-${{ matrix.cuda }}
          cache-to: type=gha,mode=max,scope=inject-${{ matrix.cuda }}
      # The release archive is the image's /warpspan, taken out of the same build.
      - name: Export the library for the release
        if: needs.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: capture/Dockerfile
          platforms: linux/amd64
          build-args: CUDA_IMAGE=${{ matrix.image }}
          outputs: type=local,dest=out
          cache-from: type=gha,scope=inject-${{ matrix.cuda }}
      - name: Pack the library
        if: needs.version.outputs.release == 'true'
        env:
          NAME: warpspan-${{ needs.version.outputs.version }}-cuda${{ matrix.cuda }}
        run: |
          mv out/warpspan "$NAME"
          tar --owner=0 --group=0 -czf "$NAME-linux-x86_64.tar.gz" "$NAME"
          tar -tzf "$NAME-linux-x86_64.tar.gz"
      - if: needs.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-inject-${{ matrix.cuda }}
          path: warpspan-*.tar.gz
          if-no-files-found: error

  release:
    needs: [version, agent, inject]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHART_VERSION: ${{ needs.version.outputs.chart_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10
      - name: Python wheel
        run: uv build --wheel --out-dir dist bridge/python
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          envsubst '${VERSION} ${CHART_VERSION}' < .github/release-notes.md > notes.md
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "First release." >> notes.md
          else
            git log --no-merges --reverse --format='- %s (%h)' "$prev..HEAD" >> notes.md
            echo >> notes.md
            echo "All changes: https://github.com/$GITHUB_REPOSITORY/compare/$prev...v$VERSION" >> notes.md
          fi
          cat notes.md
      - name: Create the release and tag the Go bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "Warpspan $VERSION" --notes-file notes.md
          git tag "bridge/go/v$VERSION" "$GITHUB_SHA"
          git push origin "bridge/go/v$VERSION"
